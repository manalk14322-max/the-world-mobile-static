<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | The World Mobile</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="lang.js"></script>
</head>
<body>
  <header class="shop-header">
    <div class="shop-container">
      <a class="shop-logo" href="index.html" aria-label="Return to home">
        <img class="logo-img" src="assets/the-world-mobile-logo.jpeg" alt="The World Mobile logo">
      </a>
    </div>
  </header>

  <main class="container" style="padding-top: 120px; padding-bottom: 80px;">
    <section class="glass" style="padding: 40px;">
      <h1 data-i18n="contact_title">Contact The World Mobile</h1>
      <p data-i18n="contact_intro">If you have questions about orders, repairs, or product availability, our team is ready to help.</p>

      <div style="display: grid; gap: 20px; margin-top: 30px;">
        <div>
          <h2 data-i18n="contact_store_location_title">Store Location</h2>
          <p data-i18n="contact_store_location_desc">Carrer de Lepant, 322, Eixample, 08025 Barcelona, Spain</p>
        </div>
        <div>
          <h2 data-i18n="contact_whatsapp_support_title">WhatsApp Support</h2>
          <p><a href="https://wa.me/34674002687?text=Hello%20The%20World%20Mobile,%20I%20need%20help..." target="_blank" rel="noopener" data-i18n="contact_whatsapp_support_desc">0034 674 002 687</a></p>
        </div>
        <div>
          <h2 data-i18n="contact_email_title">Email</h2>
          <p><a href="mailto:Theworldmobile2@gmail.com" data-i18n="contact_email_desc">Theworldmobile2@gmail.com</a></p>
        </div>
      </div>

      <a class="btn btn-primary" href="index.html" style="margin-top: 24px;" data-i18n="contact_back_to_shop">Back to Shop</a>
    </section>
  </main>
</body>
</html>
